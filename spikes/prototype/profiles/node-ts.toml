name = "node-ts"
description = "TypeScript/JavaScript with Vitest (JUnit reporter)"

test_cmd = "npx vitest run --reporter=dot --reporter=junit --outputFile.junit=build/test-results/vitest.xml"
# scope = file filter, e.g. src/rules
test_one_cmd = "npx vitest run --reporter=dot --reporter=junit --outputFile.junit=build/test-results/vitest.xml {scope}"
junit_report_glob = ["build/test-results/*.xml"]

frozen_globs = ["**/*.test.ts", "**/*.test.tsx", "**/*.spec.ts", "**/*.test.js", "**/__tests__/**", "**/__fixtures__/**", "test/**", "tests/**"]
test_globs = ["**/*.test.ts", "**/*.test.tsx", "**/*.spec.ts", "**/*.test.js", "**/__tests__/**", "test/**", "tests/**"]
source_globs = ["src/**/*.ts", "src/**/*.tsx"]
build_output_globs = ["**/node_modules/**", "**/dist/**", "**/build/**", "**/coverage/**", "**/.next/**"]
req_id_regex = '(?<![A-Za-z0-9])R(\d{3})[-_](\d{2,3})(?![0-9])'
format_cmd = "npx prettier --write ."
lint_cmd = "npx eslint ."

ci_setup = """
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
"""

[codemap]
symbol_regexes = ['(?m)^export\s+(?:default\s+)?(?:async\s+)?(?:function\*?|class|interface|type|enum|const|abstract\s+class)\s+(?P<name>\w+)']
