name = "go"
description = "Go with gotestsum (JUnit output)"

test_cmd = "gotestsum --format dots --junitfile build/test-results/go.xml -- ./..."
# scope = package pattern plus -run, e.g. ./rules/... -run TestR004
test_one_cmd = "gotestsum --format dots --junitfile build/test-results/go.xml -- {scope}"
junit_report_glob = ["build/test-results/*.xml"]

frozen_globs = ["**/*_test.go", "**/testdata/**"]
test_globs = ["**/*_test.go"]
source_globs = ["**/*.go"]
build_output_globs = ["**/build/**", "**/vendor/**", "**/bin/**"]
# Go test names look like TestR004_07..., so a letter may precede the ID.
req_id_regex = '(?<![0-9])R(\d{3})[-_](\d{2,3})(?![0-9])'
format_cmd = "gofmt -w ."
lint_cmd = "go vet ./..."

ci_setup = """
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go install gotest.tools/gotestsum@latest
"""

[codemap]
symbol_regexes = ['(?m)^func\s+(?:\([^)]*\)\s+)?(?P<name>[A-Z]\w*)', '(?m)^type\s+(?P<name>[A-Z]\w*)']
