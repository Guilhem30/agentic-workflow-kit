# Kotlin / Android multi-module Gradle builds. Test reports: JUnit XML from Gradle.
name = "kotlin-gradle"
description = "Kotlin/JVM and Android with Gradle (JUnit 5, Kotest, Robolectric)"

test_cmd = "./gradlew --quiet --console=plain test"
test_cmd_windows = "gradlew.bat --quiet --console=plain test"
# scope = Gradle task plus filters, e.g. `:core:rules:test --tests "*RuleEngineTest*"`
test_one_cmd = "./gradlew --quiet --console=plain {scope}"
test_one_cmd_windows = "gradlew.bat --quiet --console=plain {scope}"
junit_report_glob = ["**/build/test-results/**/*.xml"]
output_filter_regex = '(^e: |^w: .*(error|unresolved)|FAILED|What went wrong|error:|Exception|Could not)'

# Frozen once approved: test sources, fixtures and golden files of every test source set.
frozen_globs = [
  "**/src/test/**",
  "**/src/test*/**",
  "**/src/androidTest/**",
  "**/src/androidTest*/**",
]
test_globs = [
  "**/src/test*/**/*.kt",
  "**/src/androidTest*/**/*.kt",
  "**/src/test*/**/*.java",
  "**/src/androidTest*/**/*.java",
]
source_globs = ["**/src/main/**/*.kt", "**/src/main/**/*.java"]
build_output_globs = ["**/build/**", "**/.gradle/**", "**/.kotlin/**", "**/.cxx/**"]

req_id_regex = '(?<![A-Za-z0-9])R(\d{3})[-_](\d{2,3})(?![0-9])'

format_cmd = "./gradlew --quiet spotlessApply"
lint_cmd = "./gradlew --quiet spotlessCheck detekt"

ci_setup = """
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
"""

[codemap]
symbol_regexes = [
  '(?m)^(?:public\s+|internal\s+)?(?:(?:data|sealed|enum|value|abstract|open|annotation|inline|fun|expect|actual)\s+)*(?:class|interface|object|typealias)\s+(?P<name>\w+)',
  '(?m)^(?:public\s+|internal\s+)?(?:(?:suspend|inline|operator|infix|tailrec|expect|actual)\s+)*fun\s+(?:<[^>]+>\s+)?(?:[\w.<>?, ]+\.)?(?P<name>\w+)\s*\(',
  '(?m)^public\s+(?:(?:abstract|final|sealed|static)\s+)*(?:class|interface|enum|record)\s+(?P<name>\w+)',
]
