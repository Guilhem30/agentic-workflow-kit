name = "python-pytest"
description = "Python with pytest (JUnit XML via --junitxml)"

test_cmd = "python3 -m pytest -q -p no:cacheprovider --junitxml=build/test-results/pytest.xml"
test_cmd_windows = "python -m pytest -q -p no:cacheprovider --junitxml=build/test-results/pytest.xml"
# scope = pytest node id or path, e.g. tests/test_rules.py
test_one_cmd = "python3 -m pytest -q -p no:cacheprovider --junitxml=build/test-results/pytest.xml {scope}"
test_one_cmd_windows = "python -m pytest -q -p no:cacheprovider --junitxml=build/test-results/pytest.xml {scope}"
junit_report_glob = ["build/test-results/*.xml"]

frozen_globs = ["tests/**", "**/conftest.py"]
test_globs = ["tests/**/*.py"]
source_globs = ["src/**/*.py", "*.py"]
build_output_globs = ["**/__pycache__/**", "**/build/**", "**/dist/**", "**/*.egg-info/**", "**/.venv/**", "**/.pytest_cache/**"]
req_id_regex = '(?<![A-Za-z0-9])R(\d{3})[-_](\d{2,3})(?![0-9])'
format_cmd = "ruff format"
lint_cmd = "ruff check"

ci_setup = """
      - run: python -m pip install pytest
"""

[codemap]
symbol_regexes = ['(?m)^(?:async\s+)?(?:def|class)\s+(?P<name>[A-Za-z]\w*)']
