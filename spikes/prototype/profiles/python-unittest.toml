# Python with the standard library unittest runner (no dependencies). Used by the kit itself.
name = "python-unittest"
description = "Python 3.11+ with unittest"

test_cmd = "python3 -m unittest discover -s tests -t ."
test_cmd_windows = "python -m unittest discover -s tests -t ."
# scope = dotted test name, e.g. tests.test_lock.FreezeTest
test_one_cmd = "python3 -m unittest {scope}"
test_one_cmd_windows = "python -m unittest {scope}"
junit_report_glob = []
output_filter_regex = '^(FAIL|ERROR):|^(Ran \d+|OK|FAILED)|Error\b|^\s*assert|Traceback'

frozen_globs = ["tests/**"]
test_globs = ["tests/**/*.py"]
source_globs = ["**/*.py"]
build_output_globs = ["**/__pycache__/**", "**/build/**", "**/dist/**", "**/*.egg-info/**", "**/.venv/**"]
req_id_regex = '(?<![A-Za-z0-9])R(\d{3})[-_](\d{2,3})(?![0-9])'

ci_setup = ""

[codemap]
symbol_regexes = ['(?m)^(?:async\s+)?(?:def|class)\s+(?P<name>[A-Za-z]\w*)']
